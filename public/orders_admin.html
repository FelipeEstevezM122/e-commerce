<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pedidos - Casatek</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    body, html { background:#060d0a !important; margin:0; padding:0; font-family:'DM Sans',sans-serif; overflow-x:hidden; }

    :root {
        --green:#22C55E; --green-dark:#15803d;
        --bg:#060d0a; --card:#111f16; --border:rgba(34,197,94,.12); --border-h:rgba(34,197,94,.35);
        --text:#f3f4f6; --muted:#6b7280;
    }

    /* ===================== HEADER ===================== */
    #adminHeader {
        background:rgba(6,13,10,.95); backdrop-filter:blur(16px);
        border-bottom:1px solid var(--border);
        position:sticky; top:0; z-index:100;
        padding:0 28px; height:64px;
        display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .ah-logo { display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
    .ah-logo-dot { width:9px; height:9px; background:var(--green); border-radius:50%; box-shadow:0 0 8px rgba(34,197,94,.6); animation:pulse-dot 2.5s ease-in-out infinite; }
    @keyframes pulse-dot { 0%,100%{box-shadow:0 0 6px rgba(34,197,94,.5)} 50%{box-shadow:0 0 14px rgba(34,197,94,.9)} }
    .ah-logo-name { font-family:'Syne',sans-serif; font-size:19px; font-weight:800; color:#fff; }
    .ah-logo-badge { background:rgba(34,197,94,.15); border:1px solid var(--border-h); color:var(--green); font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:20px; }
    .ah-nav { display:flex; align-items:center; gap:2px; flex:1; justify-content:center; }
    .ah-nav a { display:flex; align-items:center; gap:7px; padding:7px 14px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid transparent; transition:all .18s; white-space:nowrap; }
    .ah-nav a:hover, .ah-nav a.active { color:var(--green); background:rgba(34,197,94,.08); border-color:var(--border); }
    .ah-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .ah-user { display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; background:rgba(34,197,94,.07); border:1px solid var(--border); border-radius:30px; }
    .ah-avatar { width:32px; height:32px; border-radius:50%; background:rgba(34,197,94,.18); border:1px solid var(--border-h); display:flex; align-items:center; justify-content:center; color:var(--green); font-size:13px; }
    .ah-user-name { font-size:12px; font-weight:700; color:#d1fae5; }
    .ah-btn-logout { display:flex; align-items:center; gap:7px; padding:8px 14px; background:transparent; border:1px solid rgba(255,255,255,.08); color:var(--muted); font-size:12px; font-weight:700; border-radius:10px; cursor:pointer; transition:all .18s; font-family:'DM Sans',sans-serif; text-decoration:none; }
    .ah-btn-logout:hover { border-color:rgba(239,68,68,.4); color:#f87171; background:rgba(239,68,68,.07); }
    .ah-hamburger { display:none; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px; width:36px; height:36px; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; font-size:16px; transition:all .18s; flex-shrink:0; }
    .ah-hamburger:hover { color:var(--green); border-color:var(--border); }
    #mobileNav { display:none; flex-direction:column; gap:4px; background:rgba(6,13,10,.98); border-bottom:1px solid var(--border); padding:12px 16px; }
    #mobileNav a { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid transparent; transition:all .18s; }
    #mobileNav a:hover, #mobileNav a.active { color:var(--green); background:rgba(34,197,94,.08); border-color:var(--border); }
    @media(max-width:900px) { .ah-nav { display:none; } .ah-hamburger { display:flex; } .ah-logo-badge { display:none; } }
    @media(max-width:480px) { #adminHeader { padding:0 14px; height:58px; } .ah-user-name { display:none; } }

    /* ===================== PANEL DE PEDIDOS ===================== */
    #ordersPage { font-family:'DM Sans',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); }
    #main { padding:32px 28px 48px; max-width:1400px; margin:0 auto; }

    .section-label { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--green); margin-bottom:6px; }
    .section-title { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; color:#fff; line-height:1.15; }

    .mini-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:20px 0; }
    .mini-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:14px; }
    .mini-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .mini-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .mini-val { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:#fff; line-height:1.1; }

    .status-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .s-tab { display:inline-flex; align-items:center; gap:6px; padding:7px 16px; border-radius:10px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.1); color:var(--muted); background:rgba(255,255,255,.03); text-decoration:none; transition:all .15s; white-space:nowrap; cursor:pointer; }
    .s-tab:hover { color:#fff; border-color:rgba(255,255,255,.2); }
    .s-tab.active { color:#fff; }
    .s-tab.t-all.active      { background:rgba(255,255,255,.1);  border-color:rgba(255,255,255,.2); }
    .s-tab.t-pending.active  { background:rgba(250,204,21,.12);  border-color:rgba(250,204,21,.3);  color:#facc15; }
    .s-tab.t-paid.active     { background:rgba(96,165,250,.12);  border-color:rgba(96,165,250,.3);  color:#60a5fa; }
    .s-tab.t-shipped.active  { background:rgba(168,85,247,.12);  border-color:rgba(168,85,247,.3);  color:#c084fc; }
    .s-tab.t-delivered.active{ background:rgba(34,197,94,.12);   border-color:rgba(34,197,94,.3);   color:#4ade80; }
    .s-tab.t-cancelled.active{ background:rgba(239,68,68,.12);   border-color:rgba(239,68,68,.3);   color:#f87171; }

    .panel { background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden; }
    .panel-head { padding:16px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .panel-head h2 { font-family:'Syne',sans-serif; font-size:15px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:rgba(0,0,0,.3); }
    th { padding:12px 18px; text-align:left; font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
    tbody tr { border-bottom:1px solid rgba(255,255,255,.04); transition:background .15s; }
    tbody tr:hover { background:rgba(255,255,255,.025); }
    td { padding:14px 18px; font-size:13px; color:#d1d5db; }

    .status-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    .s-pending   { background:rgba(250,204,21,.12); border:1px solid rgba(250,204,21,.3); color:#facc15; }
    .s-paid      { background:rgba(96,165,250,.12); border:1px solid rgba(96,165,250,.3); color:#60a5fa; }
    .s-shipped   { background:rgba(168,85,247,.12); border:1px solid rgba(168,85,247,.3); color:#c084fc; }
    .s-delivered { background:rgba(34,197,94,.12);  border:1px solid rgba(34,197,94,.3);  color:#4ade80; }
    .s-cancelled { background:rgba(239,68,68,.12);  border:1px solid rgba(239,68,68,.3);  color:#f87171; }

    .status-form { display:flex; align-items:center; gap:6px; }
    .status-select { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:5px 10px; font-size:11px; font-weight:600; color:#e5e7eb; font-family:'DM Sans',sans-serif; outline:none; cursor:pointer; transition:border-color .15s; }
    .status-select:focus { border-color:var(--green); }
    .status-select option { background:#1f2937; }
    .update-btn { background:var(--green-dark); border:none; border-radius:8px; padding:5px 10px; color:#fff; font-size:11px; font-weight:700; cursor:pointer; transition:background .15s; white-space:nowrap; }
    .update-btn:hover { background:var(--green); }

    .locked-status { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-style:italic; }
    .locked-status i { font-size:10px; opacity:.6; }

    .pag { display:flex; align-items:center; justify-content:center; gap:6px; padding:16px; flex-wrap:wrap; border-top:1px solid var(--border); }
    .pag-btn { display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; padding:0 10px; border-radius:9px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.1); color:#9ca3af; background:rgba(255,255,255,.04); text-decoration:none; transition:all .15s; cursor:pointer; }
    .pag-btn:hover { border-color:var(--green); color:var(--green); }
    .pag-btn.active { background:var(--green); color:#fff; border-color:var(--green); }
    .pag-btn.disabled { opacity:.3; pointer-events:none; }

    .empty-state { text-align:center; padding:56px 20px; color:var(--muted); }
    .empty-state i { font-size:40px; opacity:.3; display:block; margin-bottom:12px; }

    .alert-success { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.25); color:#4ade80; padding:12px 16px; border-radius:12px; margin-bottom:16px; font-size:13px; display:flex; align-items:center; gap:8px; }
    .alert-error   { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25); color:#f87171; padding:12px 16px; border-radius:12px; margin-bottom:16px; font-size:13px; display:flex; align-items:center; gap:8px; }

    .fade-up { animation:fadeUp .4s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .delay-1{animation-delay:.07s} .delay-2{animation-delay:.14s}
    .delay-3{animation-delay:.21s} .delay-4{animation-delay:.28s}

    @media(max-width:1100px) { .mini-stats { grid-template-columns:repeat(2,1fr); } }
    @media(max-width:768px) {
        #main { padding:20px 16px 40px; }
        .mini-stats { grid-template-columns:1fr 1fr; }
        th.hide-sm, td.hide-sm { display:none; }
    }
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header id="adminHeader">
    <a href="dashboard_admin.html" class="ah-logo">
        <span class="ah-logo-dot"></span>
        <span class="ah-logo-name">Casatek</span>
        <span class="ah-logo-badge">Admin</span>
    </a>
    <nav class="ah-nav">
        <a href="dashboard_admin.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="create-product_admin.html"><i class="fa-solid fa-box"></i> Productos</a>
        <a href="orders_admin.html" class="active"><i class="fa-solid fa-clipboard-list"></i> Pedidos</a>
        <a href="#"><i class="fa-solid fa-users"></i> Usuarios</a>
    </nav>
    <div class="ah-actions">
        <div class="ah-user">
            <div class="ah-avatar"><i class="fa-solid fa-circle-user"></i></div>
            <span class="ah-user-name">Admin</span>
        </div>
        <button type="button" class="ah-btn-logout" onclick="alert('Cerrar sesión (conectar con tu backend)')">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span class="hidden-xs">Salir</span>
        </button>
        <button class="ah-hamburger" onclick="toggleMobileNav()" aria-label="Menú">
            <i class="fa-solid fa-bars" id="hambIcon"></i>
        </button>
    </div>
</header>

<nav id="mobileNav">
    <a href="dashboard_admin.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="create-product_admin.html"><i class="fa-solid fa-box"></i> Productos</a>
    <a href="orders_admin.html" class="active"><i class="fa-solid fa-clipboard-list"></i> Pedidos</a>
    <a href="#"><i class="fa-solid fa-users"></i> Usuarios</a>
</nav>

<!-- ===================== PANEL DE PEDIDOS ===================== -->
<div id="ordersPage">
    <main id="main">

        <div class="fade-up">
            <p class="section-label"><i class="fa-solid fa-clipboard-list mr-1"></i> Gestión</p>
            <h1 class="section-title">Panel de <span style="color:var(--green)">Pedidos</span></h1>
        </div>

        <div class="mini-stats">
            <div class="mini-card fade-up delay-1">
                <div class="mini-icon" style="background:rgba(255,255,255,.06)">
                    <i class="fa-solid fa-border-all" style="color:#9ca3af"></i>
                </div>
                <div>
                    <p class="mini-label">Total</p>
                    <p class="mini-val" id="statTotal">0</p>
                </div>
            </div>
            <div class="mini-card fade-up delay-2">
                <div class="mini-icon" style="background:rgba(250,204,21,.15)">
                    <i class="fa-solid fa-clock" style="color:#facc15"></i>
                </div>
                <div>
                    <p class="mini-label">Pendientes</p>
                    <p class="mini-val" id="statPending">0</p>
                </div>
            </div>
            <div class="mini-card fade-up delay-3">
                <div class="mini-icon" style="background:rgba(168,85,247,.15)">
                    <i class="fa-solid fa-truck" style="color:#c084fc"></i>
                </div>
                <div>
                    <p class="mini-label">Enviados</p>
                    <p class="mini-val" id="statShipped">0</p>
                </div>
            </div>
            <div class="mini-card fade-up delay-4">
                <div class="mini-icon" style="background:rgba(34,197,94,.15)">
                    <i class="fa-solid fa-circle-check" style="color:#22C55E"></i>
                </div>
                <div>
                    <p class="mini-label">Entregados</p>
                    <p class="mini-val" id="statDelivered">0</p>
                </div>
            </div>
        </div>

        <div class="alert-success" id="successAlert" style="display:none">
            <i class="fa-solid fa-circle-check"></i> <span id="successMsg"></span>
        </div>
        <div class="alert-error" id="errorAlert" style="display:none">
            <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorMsg"></span>
        </div>

        <div class="status-tabs" id="statusTabs"></div>

        <div class="panel">
            <div class="panel-head">
                <h2><i class="fa-solid fa-clipboard-list" style="color:#c084fc"></i> Lista de Pedidos</h2>
                <span style="font-size:11px;color:var(--muted)" id="tableCount">0 pedidos</span>
            </div>

            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th class="hide-sm">Pago</th>
                            <th>Estado</th>
                            <th>Cambiar Estado</th>
                            <th class="hide-sm">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>

            <div class="pag" id="pagination"></div>
        </div>

    </main>
</div>

<script>
    // ---------- Menú móvil (header) ----------
    function toggleMobileNav() {
        const nav  = document.getElementById('mobileNav');
        const icon = document.getElementById('hambIcon');
        const open = nav.style.display === 'flex';
        nav.style.display = open ? 'none' : 'flex';
        icon.className    = open ? 'fa-solid fa-bars' : 'fa-solid fa-xmark';
    }

    // ---------- Datos de ejemplo (sustituye por tu fetch/API real) ----------
    const STATUS_MAP = {
        pending:   { cls: 's-pending',   label: 'Pendiente' },
        paid:      { cls: 's-paid',      label: 'Pagado' },
        shipped:   { cls: 's-shipped',   label: 'Enviado' },
        delivered: { cls: 's-delivered', label: 'Entregado' },
        cancelled: { cls: 's-cancelled', label: 'Cancelado' }
    };
    const TABS = [
        { val: 'pending',   icon: 'fa-clock',        cls: 't-pending',   label: 'Pendientes' },
        { val: 'paid',      icon: 'fa-credit-card',  cls: 't-paid',      label: 'Pagados' },
        { val: 'shipped',   icon: 'fa-truck',        cls: 't-shipped',   label: 'Enviados' },
        { val: 'delivered', icon: 'fa-circle-check', cls: 't-delivered', label: 'Entregados' },
        { val: 'cancelled', icon: 'fa-ban',          cls: 't-cancelled', label: 'Cancelados' }
    ];

    let orders = [
        { id: 1, order_number: 'CT-0001', user: { name: 'Marisol Quispe', email: 'marisol@example.com' }, total: 1250.00, payment_method: 'qr', status: 'pending', created_at: '2026-09-24T10:15:00' },
        { id: 2, order_number: 'CT-0002', user: { name: 'Jorge Fernández', email: 'jorge@example.com' }, total: 480.50, payment_method: 'tarjeta', status: 'paid', created_at: '2026-09-23T16:40:00' },
        { id: 3, order_number: 'CT-0003', user: { name: 'Ana Mamani', email: 'ana@example.com' }, total: 3120.00, payment_method: 'transferencia', status: 'shipped', created_at: '2026-09-22T09:05:00' },
        { id: 4, order_number: 'CT-0004', user: { name: 'Luis Choque', email: 'luis@example.com' }, total: 210.00, payment_method: 'qr', status: 'delivered', created_at: '2026-09-20T12:30:00' },
        { id: 5, order_number: 'CT-0005', user: { name: 'Carla Rojas', email: 'carla@example.com' }, total: 990.00, payment_method: 'tarjeta', status: 'cancelled', created_at: '2026-09-19T08:00:00' },
        { id: 6, order_number: 'CT-0006', user: { name: 'Pedro Vargas', email: 'pedro@example.com' }, total: 640.00, payment_method: 'qr', status: 'pending', created_at: '2026-09-18T14:20:00' }
    ];

    let currentStatus = null;
    let currentPage = 1;
    const perPage = 5;

    function formatBs(n) { return 'Bs. ' + Number(n).toFixed(2); }
    function formatDate(iso) {
        const d = new Date(iso);
        const date = d.toLocaleDateString('es-BO', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const time = d.toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit', hour12: false });
        return { date, time };
    }

    function renderStats() {
        document.getElementById('statTotal').textContent = orders.length;
        document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('statShipped').textContent = orders.filter(o => o.status === 'shipped').length;
        document.getElementById('statDelivered').textContent = orders.filter(o => o.status === 'delivered').length;
    }

    function renderTabs() {
        const wrap = document.getElementById('statusTabs');
        let html = `<span class="s-tab t-all ${!currentStatus ? 'active' : ''}" onclick="setStatus(null)">
            <i class="fa-solid fa-border-all"></i> Todos
            <span style="background:rgba(255,255,255,.1);padding:1px 7px;border-radius:10px;font-size:10px">${orders.length}</span>
        </span>`;
        html += TABS.map(t => `
            <span class="s-tab ${t.cls} ${currentStatus === t.val ? 'active' : ''}" onclick="setStatus('${t.val}')">
                <i class="fa-solid ${t.icon}"></i> ${t.label}
            </span>`).join('');
        wrap.innerHTML = html;
    }

    function setStatus(val) {
        currentStatus = val;
        currentPage = 1;
        renderAll();
    }

    function updateStatus(orderId, newStatus) {
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        order.status = newStatus;
        showAlert('success', `Pedido ${order.order_number} actualizado a "${STATUS_MAP[newStatus].label}".`);
        renderAll();
        // Aquí iría tu fetch/PATCH real hacia el backend
    }

    function showAlert(type, msg) {
        const success = document.getElementById('successAlert');
        const error = document.getElementById('errorAlert');
        success.style.display = 'none';
        error.style.display = 'none';
        if (type === 'success') {
            document.getElementById('successMsg').textContent = msg;
            success.style.display = 'flex';
        } else {
            document.getElementById('errorMsg').textContent = msg;
            error.style.display = 'flex';
        }
    }

    function renderTable() {
        const filtered = currentStatus ? orders.filter(o => o.status === currentStatus) : orders;
        document.getElementById('tableCount').textContent = `${filtered.length} pedidos`;

        const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
        if (currentPage > totalPages) currentPage = totalPages;
        const pageItems = filtered.slice((currentPage - 1) * perPage, currentPage * perPage);

        const body = document.getElementById('ordersBody');
        if (!pageItems.length) {
            body.innerHTML = `
                <tr><td colspan="7">
                    <div class="empty-state">
                        <i class="fa-solid fa-clipboard"></i>
                        <p>No se encontraron pedidos</p>
                    </div>
                </td></tr>`;
        } else {
            body.innerHTML = pageItems.map(order => {
                const s = STATUS_MAP[order.status];
                const locked = ['delivered', 'cancelled'].includes(order.status);
                const { date, time } = formatDate(order.created_at);
                const statusCell = locked
                    ? `<span class="locked-status"><i class="fa-solid fa-lock"></i> ${order.status === 'delivered' ? 'Entregado' : 'Cancelado'}</span>`
                    : `<div class="status-form">
                        <select class="status-select" id="sel-${order.id}">
                            ${Object.entries(STATUS_MAP).map(([val, m]) => `<option value="${val}" ${order.status === val ? 'selected' : ''}>${m.label}</option>`).join('')}
                        </select>
                        <button type="button" class="update-btn" onclick="updateStatus(${order.id}, document.getElementById('sel-${order.id}').value)">
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </div>`;

                return `
                    <tr>
                        <td style="font-weight:700;color:#fff;font-family:monospace;font-size:12px">${order.order_number}</td>
                        <td>
                            <p style="font-weight:600;color:#e5e7eb;font-size:13px;margin:0">${order.user.name || '—'}</p>
                            <p style="font-size:11px;color:var(--muted);margin:2px 0 0">${order.user.email || ''}</p>
                        </td>
                        <td style="color:var(--green);font-weight:800;white-space:nowrap">${formatBs(order.total)}</td>
                        <td class="hide-sm" style="font-size:12px;text-transform:capitalize;color:#d1d5db">${order.payment_method || '—'}</td>
                        <td><span class="status-badge ${s.cls}">${s.label}</span></td>
                        <td>${statusCell}</td>
                        <td class="hide-sm" style="font-size:11px;color:var(--muted)">${date}<br><span style="font-size:10px">${time}</span></td>
                    </tr>`;
            }).join('');
        }

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const wrap = document.getElementById('pagination');
        if (totalPages <= 1) { wrap.innerHTML = ''; return; }

        let html = `<span class="pag-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></span>`;
        for (let p = 1; p <= totalPages; p++) {
            html += `<span class="pag-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</span>`;
        }
        html += `<span class="pag-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></span>`;
        wrap.innerHTML = html;
    }

    function goPage(p) {
        currentPage = p;
        renderTable();
    }

    function renderAll() {
        renderStats();
        renderTabs();
        renderTable();
    }

    renderAll();
</script>

</body>
</html>
