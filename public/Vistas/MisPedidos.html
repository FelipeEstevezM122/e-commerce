<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis pedidos | CASATEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="min-h-screen bg-green-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <main class="mx-auto max-w-5xl px-4 py-10 sm:px-8">
        <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
                <p class="text-xs font-black uppercase tracking-[.2em] text-green-600">CASATEK</p>
                <h1 class="mt-2 text-3xl font-black">Mis pedidos</h1>
            </div>
            <nav class="flex gap-3 text-sm font-bold">
                <a class="rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-700" href="/MisTickets.html">Mis tickets</a>
                <a class="rounded-lg bg-green-600 px-4 py-2 text-white" href="/productos">Seguir comprando</a>
            </nav>
        </header>
        <p id="notice" class="mb-5 hidden rounded-xl bg-green-100 p-4 text-sm font-semibold text-green-800"></p>
        <p id="error" class="mb-5 hidden rounded-xl bg-red-100 p-4 text-sm font-semibold text-red-700"></p>
        <section id="orders" class="space-y-5"></section>
    </main>
<script>
const token = localStorage.getItem('token');
const user = (() => { try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; } })();
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money = value => Number(value || 0).toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const statusText = { pending: 'Pendiente de pago', paid: 'Pagado', shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado' };

function showError(message) {
    const el = document.getElementById('error');
    el.textContent = message;
    el.classList.remove('hidden');
}

async function downloadTicket(ticket, button) {
    button.disabled = true;
    try {
        const response = await fetch(`/api/tickets/${ticket.id}/download`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/pdf' },
        });
        if (!response.ok) throw new Error('No se pudo descargar el ticket (HTTP ' + response.status + ').');
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = `${ticket.ticket_number}.pdf`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (error) {
        showError(error.message);
    } finally {
        button.disabled = false;
    }
}

function renderOrder(order) {
    const card = document.createElement('article');
    card.className = 'rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900';
    const lines = (order.items || []).map(item => `
        <li class="flex justify-between gap-4 border-b border-gray-100 py-3 text-sm dark:border-gray-800">
            <span>${Number(item.quantity)} × ${esc(item.product?.name || 'Producto')}</span>
            <span class="font-semibold">Bs. ${money(Number(item.price_when_ordered) * Number(item.quantity))}</span>
        </li>`).join('');
    const ticket = order.ticket;
    card.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <p class="text-xs font-bold uppercase tracking-wider text-gray-500">Pedido ${esc(order.order_number)}</p>
                <p class="mt-1 text-sm text-gray-500">${new Date(order.created_at).toLocaleString('es-BO')}</p>
            </div>
            <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-black text-green-800">${esc(statusText[order.status] || order.status)}</span>
        </div>
        <ul class="my-4">${lines || '<li class="py-3 text-sm text-gray-500">Sin productos</li>'}</ul>
        <div class="flex flex-wrap items-center justify-between gap-4">
            <p class="font-black">Total: <span class="text-green-700 dark:text-green-400">Bs. ${money(order.total)}</span></p>
            ${order.status === 'paid' && ticket ? `<button type="button" class="download-ticket rounded-lg bg-green-600 px-4 py-2 text-sm font-bold text-white hover:bg-green-700"><i class="fa-solid fa-download mr-2"></i>Ticket ${esc(ticket.ticket_number)} · PDF</button>` : '<span class="text-sm text-gray-500">El ticket estará disponible cuando el pedido esté pagado.</span>'}
        </div>`;
    if (order.status === 'paid' && ticket) card.querySelector('.download-ticket').addEventListener('click', event => downloadTicket(ticket, event.currentTarget));
    return card;
}

async function loadOrders() {
    if (!token || !user) {
        window.location.href = '/iniciarsesion?redirect=mis-pedidos';
        return;
    }
    const createdOrder = new URLSearchParams(window.location.search).get('pedido');
    if (createdOrder) {
        const notice = document.getElementById('notice');
        notice.textContent = 'Pedido creado. El ticket estará disponible cuando se confirme el pago.';
        notice.classList.remove('hidden');
    }
    try {
        const orders = [];
        let pageNumber = 1;
        let lastPage = 1;
        do {
            const response = await fetch(`/api/orders?page=${pageNumber}`, {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' },
            });
            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/iniciarsesion?redirect=mis-pedidos';
                return;
            }
            if (!response.ok) throw new Error('No se pudieron cargar tus pedidos (HTTP ' + response.status + ').');
            const payload = await response.json();
            const page = payload.datos;
            if (!Array.isArray(page?.data)) throw new Error('La respuesta de pedidos no tiene el formato esperado.');
            orders.push(...page.data);
            pageNumber = page.current_page + 1;
            lastPage = page.last_page;
        } while (pageNumber <= lastPage);
        const container = document.getElementById('orders');
        if (!orders.length) {
            container.innerHTML = '<p class="rounded-xl border border-dashed border-gray-300 p-10 text-center text-gray-500 dark:border-gray-700">Todavía no tienes pedidos.</p>';
            return;
        }
        orders.forEach(order => container.appendChild(renderOrder(order)));
    } catch (error) {
        showError(error.message || 'Error de conexión al cargar tus pedidos.');
    }
}
loadOrders();
</script>
</body>
</html>
